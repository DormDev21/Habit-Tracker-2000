<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker 2000</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: white; 
            color: black;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }
        h1 {
            font-size: 20px;
            font-weight: normal;
            border-bottom: 1px solid black;
            padding-bottom: 10px;
        }
        .input-group {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }
        input {
            padding: 5px;
            border: 1px solid black;
            border-radius: 0;
            background-color: white;
        }
        input[type="text"] { flex: 2; }
        input[type="number"] { flex: 1; }
        
        button {
            padding: 5px 10px;
            border: 1px solid black;
            background-color: white;
            color: black;
            cursor: pointer;
            border-radius: 0;
        }
        button:hover {
            background-color: white;
        }

        
        .tracker-box {
            border: 1px solid black;
            background-color: white;
            padding: 30px; 
            min-height: 50px;
        }
        
        .habit-card {
            border: 1px solid black;
            background-color: white; 
            padding: 15px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        .habit-card.done {
            background-color: white; 
        }
        
        .habit-card:last-child {
            margin-bottom: 0;
        }
        .habit-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .progress-container {
            width: 100%;
            border: 1px solid black;
            height: 10px;
            margin-bottom: 10px;
            background-color: white;
        }
        .progress-bar {
            height: 100%;
            background-color: gray; 
            width: 0%;
            transition: width 0.2s, background-color 0.2s;
        }
        .progress-bar.done {
            background-color: lightgreen; 
        }
        .controls {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <h1>Habit Tracker 2000</h1>
    
    <div class="input-group">
        <input type="text" id="habitName" placeholder="Habit name">
        <input type="number" id="habitTarget" placeholder="Target" min="1">
        <button onclick="addHabit()">Add</button>
    </div>

    <div class="tracker-box" id="habitList"></div>

    <script>
        const STORAGE_KEY = "grit_data_simple";
        let habits = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
            renderHabits();
        }

        function addHabit() {
            const nameInput = document.getElementById("habitName");
            const targetInput = document.getElementById("habitTarget");
            
            const name = nameInput.value.trim();
            const target = parseInt(targetInput.value);

            if (!name) {
                alert("Name cannot be empty.");
                return;
            }
            if (!target || target <= 0) {
                alert("Target must be at least 1.");
                return;
            }

            habits.push({
                id: Date.now(), 
                name: name,
                target: target,
                current: 0
            });
            
            nameInput.value = "";
            targetInput.value = "";
            saveData();
        }

        function changeProgress(id, amount) {
            const habit = habits.find(h => h.id === id);
            if (habit) {
                habit.current += amount;
                
                if (habit.current < 0) habit.current = 0;
                if (habit.current > habit.target) habit.current = habit.target;
                
                saveData();
            }
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveData();
        }

        function renderHabits() {
            const listDiv = document.getElementById("habitList");
            listDiv.innerHTML = ""; 

            if (habits.length === 0) {
                listDiv.innerHTML = "<p style='margin: 0;'>No habits.</p>";
                return;
            }

            habits.forEach(habit => {
                const percent = (habit.current / habit.target) * 100;
                const isDone = habit.current === habit.target;

                const card = document.createElement("div");
                // Adds the 'done' class to the whole card if the target is reached
                card.className = `habit-card ${isDone ? 'done' : ''}`; 
                card.innerHTML = `
                    <div class="habit-header">
                        <span>${habit.name}</span>
                        <span>${habit.current} / ${habit.target}</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar ${isDone ? 'done' : ''}" style="width: ${percent}%;"></div>
                    </div>
                    <div class="controls">
                        <div>
                            <button onclick="changeProgress(${habit.id}, -1)">-</button>
                            <button onclick="changeProgress(${habit.id}, 1)">+</button>
                        </div>
                        <button onclick="deleteHabit(${habit.id})">Delete</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        renderHabits();
    </script>
</body>
</html>
